name: A-share intraday watch

on:
  schedule:
    # Every 5 minutes during A-share trading hours, Monday-Friday, China time.
    # China 09:30-11:30 => UTC 01:30-03:30; China 13:00-15:00 => UTC 05:00-07:00.
    - cron: "30-59/5 1 * * 1-5"
    - cron: "*/5 2 * * 1-5"
    - cron: "0-30/5 3 * * 1-5"
    - cron: "*/5 5-6 * * 1-5"
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intraday-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intraday-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -U pandas numpy pyyaml akshare
      - name: Run intraday watch snapshot
        run: python -m automation.run_intraday_watch --config configs/smallcap_best.yaml
      - name: Commit reports
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: add intraday watch snapshot"
          file_pattern: reports/intraday/**
