name: A-share after-close selection

on:
  schedule:
    # 16:15 China time, Monday-Friday. The script records output by latest market data date.
    - cron: "15 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  after-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -U pandas numpy pyyaml akshare
      - name: Run after-close selection
        run: python -m automation.run_after_close --config configs/smallcap_best.yaml
      - name: Commit reports
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: add after-close selection reports"
          file_pattern: reports/daily/**
