data:
  path: data/raw
  symbols_file: data/universe/smallcap_symbols.csv
  start: "2021-01-04"
  end: "2026-08-18"

account:
  initial_cash: 100000
  commission_rate: 0.0003
  min_commission: 5
  stamp_tax_rate: 0.001
  slippage_bps: 3

risk:
  max_position_pct: 0.22
  max_order_value_pct: 0.20
  lot_size: 100
  enforce_t1: true
  allow_partial_fills: true
  max_volume_participation_pct: 0.10
  volume_unit_multiplier: 100
  limit_move_pct: 0.098
  block_buy_limit_up: true
  block_sell_limit_down: true

health:
  enabled: true
  path: data/health/latest.csv
  min_turnover_rate: 0.5
  min_amount: 30000000
  min_pe: 0
  max_pe: 120
  min_float_market_cap: 1000000000
  max_float_market_cap: 20000000000
  min_health_score: 60
  exclude_st: true
  exclude_suspended: true
  exclude_limit_up: true
  exclude_limit_down: false

flow:
  enabled: true
  path: data/flow/latest.csv
  lookback_days: 5
  min_positive_days: 3
  min_main_net_inflow_ratio: 0.5
  min_main_net_inflow_amount: 0
  max_age_days: 7

factors:
  enabled: true
  event_path: data/factors/events.csv
  macro_path: data/factors/macro.csv
  event_lookback_days: 10
  min_event_confidence: 0.6
  negative_event_score_block: -35
  macro_risk_score_block: -40
  max_score_adjustment: 12

strategy:
  name: small_cap_momentum
  momentum_window: 40
  rebalance_interval: 20
  top_n: 5
  target_gross_exposure: 0.85
  min_momentum: 0.00
  min_trade_value: 3000
  support_window: 20
  target_window: 60
  trend_window: 5
  risk_reward_ratio: 2.0
  entry_candidate_multiplier: 4
  entry_max_above_support_pct: 0.08
  entry_min_below_target_pct: 0.05
  entry_max_recent_runup_pct: 0.10
  entry_min_trend_slope: -0.01
  capital_recycle_enabled: true
  capital_recycle_min_holding_days: 15
  capital_recycle_max_holding_days: 45
  capital_recycle_rank_multiplier: 2
  capital_recycle_min_momentum: 0.00
  capital_recycle_breakeven_buffer_pct: 0.003
  capital_recycle_max_loss_pct: -0.06

output:
  backtest_dir: runs/smallcap_live_backtest
  paper_dir: runs/smallcap_live_paper
